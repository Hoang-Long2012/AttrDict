[project]
name = "attrDict"
version = "0.1.0"
description = "A lightweight dictionary with attribute-style access."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

authors = [
	{ name = "Hoàng Long", email = "hoanglongcodes@gmail.com" }
]

keywords = [
	"attrdict",
	"dictionary",
	"dict",
	"attribute",
	"mapping"
]

classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Software Development :: Libraries :: Python Modules",
	"Typing :: Typed"
]

dependencies = []

[project.urls]
Homepage = "https://github.com/Hoang-Long2012/AttrDict"
Repository = "https://github.com/Hoang-Long2012/AttrDict"
Issues = "https://github.com/Hoang-Long2012/AttrDict/issues"
Changelog = "https://github.com/Hoang-Long2012/AttrDict/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
